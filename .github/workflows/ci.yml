name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Compile
        run: npm run build

      - name: Run Test Suite
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/student-rag-test
          JWT_SECRET: test_ci_secret_super_long_key_123456789
          STORAGE_PROVIDER: local
          STORAGE_LOCAL_DIR: ./storage
          GEMINI_API_KEY: mock_key_for_ci
        run: npm test
